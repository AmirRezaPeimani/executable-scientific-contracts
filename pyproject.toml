[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "executable-scientific-contracts"
version = "1.0.0"
description = "Executable scientific contracts for research auditing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Amir Reza Peimani", email = "amir.peimani@utoronto.ca"},
]
dependencies = ["PyYAML>=6"]

[project.urls]
Repository = "https://github.com/AmirRezaPeimani/executable-scientific-contracts"

[project.optional-dependencies]
test = ["pytest>=8"]
figures = ["matplotlib>=3.7"]
prospective = ["pandas>=2"]

[project.scripts]
conform = "conform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/executable-scientific-contracts/contracts" = [
  "contracts/contracts.yaml",
  "contracts/mutations.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
